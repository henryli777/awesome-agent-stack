name: Verify and publish directory

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: read

concurrency:
  group: directory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh official public repository metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_metadata.py
      - name: Generate and verify the refreshed catalog
        run: |
          python3 scripts/catalog.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/catalog.py --check
          node --test tests/*.test.mjs
          node --check site/app.js
      - name: Save metadata without overwriting concurrent main changes
        id: snapshot
        run: |
          python3 scripts/publish_snapshot.py --expected-sha "$(git rev-parse HEAD)"
          git add data/catalog.json site/catalog.json README.md README.zh-CN.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: refresh official GitHub metadata'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # GITHUB_TOKEN pushes do not trigger another workflow; this run publishes its verified snapshot.

  verify:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test catalog validation and generation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check generated artifacts
        run: python3 scripts/catalog.py --check
      - name: Test browser filtering and URL state
        run: node --test tests/*.test.mjs
      - name: Check browser script syntax
        run: node --check site/app.js
      - name: Verify the publication snapshot
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: snapshot
        run: |
          python3 scripts/publish_snapshot.py --expected-sha "$(git rev-parse HEAD)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  publish:
    if: always() && needs.verify.result == 'success' && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reject a superseded deployment after environment approval
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        run: python3 scripts/publish_snapshot.py --expected-sha "$EXPECTED_SHA"
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
